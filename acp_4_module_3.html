<!DOCTYPE html>
<html lang="en">
<head>
  <title>My Study Progress Dashboard</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

  <style>
    body { background-color: #f4f7ff; background-image: linear-gradient(to right, beige, rgb(97, 86, 86)); font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;}
    .jumbotron { background-color: #e8edff;background-image: linear-gradient(to right, beige, rgb(97, 86, 86)); border-left: 6px solid #FF5A43; }
    .jumbotron h1 { color: #FF5A43; }
    .section-title { color: #FF5A43; margin-top: 30px; margin-bottom: 15px; }
    p { font-weight: bold; margin-bottom: 5px; }
    .s:hover {
            transform: translateY(-5px);
            border-color: #052837;
            size: 8px;
            color: #052837;
            font-weight: bold;
    }
  </style>
</head>
<body>
  <!-- TOPIC 1: JUMBOTRON -->
  <div class="jumbotron jumbotron-fluid">
    <div class="container">
      <h1>My Study Progress Dashboard</h1>
      <p class="lead">Track your subjects, completed lessons, and learning progress in one place.</p>

      <!-- TOPIC 2: BUTTONS -->
      <button class="btn btn-primary">Math</button>
      <button class="btn btn-success">Physics</button>
      <button class="btn btn-warning">Computer Science</button>
      <button class="btn btn-danger">Arts</button>
    </div>
  </div>

  <div class="container">

    <!-- TOPIC 3: BADGES -->
    <h2 class="section-title">Lessons Completed <div class="s"><span class="badge badge-danger">24</span></h2></div>

    <div class="s"><p>Math<span class="badge badge-primary">1 lessons</span></p></div>
    <div class="s"><p>Physics<span class="badge badge-success">3 lessons</span></p></div>
    <div class="s"><p>Computer Science<span class="badge badge-warning">5 lessons</span></p></div>
    <div class="s"><p>Arts<span class="badge badge-info">9 lessons</span></p></div>

    <!-- TOPIC 4: PROGRESS BARS -->
    <h2 class="section-title">Subject Progress</h2>

    <div class="back"><p>Math</p>
    <div class="progress mb-3">
      <div class="progress-bar bg-success" style="width: 80%">80%</div>
    </div>

    <p>Physics</p>
    <div class="progress mb-3">
      <div class="progress-bar bg-warning" style="width: 65%">65%</div>
    </div>

    <p>Computer Science</p>
    <div class="progress mb-3">
      <div class="progress-bar bg-primary" style="width: 75%">75%</div>
    </div>

    <p>Arts</p>
    <div class="progress mb-3">
      <div class="progress-bar bg-danger" style="width: 5%">5%</div>
    </div>
    </div>

  </div>
  

  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>
</html>
